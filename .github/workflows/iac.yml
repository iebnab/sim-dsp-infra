name: iac
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state-access:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          create_credentials_file: true
      - name: Verify state prefix allowed and other prefix denied
        env:
          FEDERATED_TOKEN: ${{ steps.auth.outputs.auth_token }}
        run: |
          set -euo pipefail
          request() {
            printf 'header = "Authorization: Bearer %s"\n' "$FEDERATED_TOKEN" |
              curl --config - --silent --show-error --output /dev/null --write-out '%{http_code}' "$1"
          }
          allowed="$(request 'https://storage.googleapis.com/storage/v1/b/cnapp-micro-14591677-iac-live/o/sim-dsp-infra%2Fprivate-bucket%2Fdefault.tfstate?alt=media')"
          denied="$(request 'https://storage.googleapis.com/storage/v1/b/cnapp-micro-14591677-iac-live/o/nonprefix-probe?alt=media')"
          echo "state-prefix GET: $allowed; nonprefix GET: $denied"
          test "$allowed" = 200
          test "$denied" = 403
      - name: Verify locked refresh-only plan
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/tofu.tar.gz" https://github.com/opentofu/opentofu/releases/download/v1.13.9/tofu_1.13.9_linux_amd64.tar.gz
          echo "b34b327cc1ef07178207b6f2cd1f5276537d3e5b7be316500f6dac50d4c0a857  $RUNNER_TEMP/tofu.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tofu.tar.gz" -C "$RUNNER_TEMP" tofu
          "$RUNNER_TEMP/tofu" -chdir=terraform-live init -input=false -lock=true -no-color >"$RUNNER_TEMP/init.log" 2>&1
          rc=0
          "$RUNNER_TEMP/tofu" -chdir=terraform-live plan -refresh-only -input=false -lock=true -detailed-exitcode -no-color -out="$RUNNER_TEMP/refresh.bin" >"$RUNNER_TEMP/plan.log" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "refresh-only failed: $rc"; exit "$rc"; fi
          echo "locked refresh-only plan: $rc (0=no drift, 2=drift)"
          rm -f "$RUNNER_TEMP/refresh.bin" "$RUNNER_TEMP/init.log" "$RUNNER_TEMP/plan.log"
